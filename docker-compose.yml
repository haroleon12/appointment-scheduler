services:
  frontend:
    build: ./frontend
    container_name: appointment-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: appointment-backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/appointments_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ItIsAVeryStrongPassword!

  db:
    image: postgres:15
    container_name: appointment-db
    environment:
      POSTGRES_DB: appointments_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ItIsAVeryStrongPassword!
    ports:
      - "5432:5432"
    volumes:
      - appointment_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

volumes:
  appointment_data: